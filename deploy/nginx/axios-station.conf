# /etc/nginx/sites-available/axios-station.conf
# Replace example.com with your domain, then: ln -s ../sites-available/axios-station.conf /etc/nginx/sites-enabled/

limit_req_zone $binary_remote_addr zone=axs_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=axs_login:10m rate=10r/m;

upstream axios_station {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 12m;   # keep in sync with UPLOAD_MAX_BYTES

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    access_log /var/log/nginx/axios-station.access.log;
    error_log  /var/log/nginx/axios-station.error.log warn;

    # Immutable build assets
    location /_next/static/ {
        proxy_pass http://axios_station;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # User uploads served directly by Nginx (never executed)
    location /uploads/ {
        alias /var/www/axios-station/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        location ~* \.(php|pl|py|sh|cgi|html?)$ { deny all; }
    }

    location = /api/auth/callback/credentials {
        limit_req zone=axs_login burst=5 nodelay;
        proxy_pass http://axios_station;
        include /etc/nginx/snippets/axs-proxy.conf;
    }

    location /api/ {
        limit_req zone=axs_api burst=30 nodelay;
        proxy_pass http://axios_station;
        include /etc/nginx/snippets/axs-proxy.conf;
    }

    location / {
        proxy_pass http://axios_station;
        include /etc/nginx/snippets/axs-proxy.conf;
    }
}
